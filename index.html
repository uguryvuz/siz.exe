        '<h1 class="lose-t glitch" data-text="KAYBETTİN">KAYBETTİN</h1>' +
        '<div class="lose-hearts rv">' + hearts + '</div>' +
        '<p class="lose-sub rv" style="animation-delay:.15s">TÜM CANLARIN BİTTİ<br>FIREWALL KAZANDI</p>' +
        '<div class="lose-nick rv" style="animation-delay:.3s">' + (Game.nick || 'DEBUG') + '</div>' +
        '<div class="fin-panel rv" style="animation-delay:.45s">' +
          '<div class="fin-row"><span>KATMAN</span><b>' + (idx + 1) + '/' + Layers.length + '</b></div>' +
          '<div class="fin-row"><span>SKOR</span><b>' + score + '</b></div>' +
          '<div class="fin-row"><span>SÜRE</span><b>' + fmtTime(ms) + '</b></div>' +
        '</div>' +
        '<button class="btn primary rv" id="retry" style="animation-delay:.6s" disabled>TEKRAR OYNA ►</button>' +
        '<div class="foot">' + CONFIG.footer + '</div>');
      Sfx.lose(); Haptic.err();

      // Oyuncu son saniyelerde ekrana hızlı hızlı dokunuyor olabilir: buton kısa süre kilitli kalır
      const btn = $('#retry', s);
      Game.later(() => { btn.disabled = false; }, CONFIG.retryLockMs);
      tap(btn, () => { if (btn.disabled) return; Sfx.ok(); Game.begin(); });   // aynı takma adla baştan başlar
    }
  },

  final: {
    enter() {
      Game.t1 = performance.now(); Game.locked = true;
      Hud.mode('idle');
      const ms = Game.t1 - Game.t0, secs = Math.floor(ms / 1000), score = Game.score;
      let rank = CONFIG.ranks[0];
      CONFIG.ranks.forEach(r => { if (score >= r.min) rank = r; });
      const code = makeCode(Game.nick, score, secs);
      const best = parseInt(Store.get('hk_best') || '0', 10) || 0;
      const isNew = score > best;
      if (isNew) Store.set('hk_best', String(score));
      const s = Game.screen('final',
        '<canvas id="rain"></canvas>' +
        '<div class="fin-body">' +
          '<h1 class="fin-t glitch" data-text="ACCESS GRANTED">ACCESS GRANTED</h1>' +
          '<div class="fin-nick rv" style="animation-delay:.2s">' + Game.nick + '</div>' +
          '<div class="fin-panel">' +
            '<div class="fin-row rv" style="animation-delay:.35s"><span>SÜRE</span><b>' + fmtTime(ms) + '</b></div>' +
            '<div class="fin-row rv" style="animation-delay:.55s"><span>SKOR</span><b>' + score + '</b></div>' +
            '<div class="fin-row rv" style="animation-delay:.75s"><span>RÜTBE</span><b class="rank">' + rank.name + '</b></div>' +
          '</div>' +
          '<div class="fin-code rv" style="animation-delay:1s"><span>KOD</span><b id="code">······</b></div>' +
          '<div class="fin-new">' + (isNew && best > 0 ? 'YENİ REKOR!' : '') + '</div>' +
          '<button class="btn primary hold" id="again"><i class="hfill"></i><span>TEKRAR OYNA</span><small>BASILI TUT</small></button>' +
          '<div class="foot">' + CONFIG.footer + '</div>' +
        '</div>');
      Rain.start($('#rain', s));
      Sfx.win(); Haptic.ok();

      // Kod "çözülüyor" animasyonu: harfler sırayla yerine oturur (bitince sabit kalır)
      const el = $('#code', s), CH = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', last = 8 + (code.length - 1) * 2;
      let n = 0;
      const spin = () => {
        n++;
        let t = '';
        for (let i = 0; i < code.length; i++) t += n >= 8 + i * 2 ? code[i] : CH[rand(0, CH.length - 1)];
        el.textContent = t;
        if (n < last) Game.later(spin, 80);
      };
      Game.later(spin, 1000);

      // Yanlışlıkla yeniden başlamasın: butona ~1 sn basılı tutmak gerekir
      const btn = $('#again', s), fill = $('.hfill', s), HOLD = 1000;
      let timer = 0;
      const stop = () => {
        clearTimeout(timer); btn.classList.remove('press');
        fill.style.transition = 'transform .15s'; fill.style.transform = 'scaleX(0)';
      };
      btn.addEventListener('pointerdown', e => {
        e.preventDefault(); Sfx.click();
        fill.style.transition = 'transform ' + HOLD + 'ms linear'; fill.style.transform = 'scaleX(1)';
        timer = Game.later(() => { Sfx.ok(); Game.go('nick'); }, HOLD);
      });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => btn.addEventListener(t, stop));
    },
    exit() { Rain.stop(); }
  }
};

/* ============ GAME (durum makinesi + ortak sistemler) ============ */
const Game = {
  state: null, layerIndex: 0, layer: null, ctx: null,
  lives: 3, hints: 2, score: 0, layerScore0: 0, nick: '', t0: 0, t1: 0,
  locked: false, pending: [], stage: null, flashEl: null,

  init() { this.stage = $('#stage'); this.flashEl = $('#flash'); },

  later(fn, ms) {
    const id = setTimeout(() => { this.pending = this.pending.filter(x => x !== id); fn(); }, ms);
    this.pending.push(id); return id;
  },
  clearPending() { this.pending.forEach(clearTimeout); this.pending = []; },

  go(name, arg) {
    const prev = States[this.state];
    if (prev && prev.exit) prev.exit();
    this.clearPending();
    this.state = name;
    States[name].enter(arg || {});
  },

  screen(cls, html) {
    const s = document.createElement('section');
    s.className = 'screen ' + cls; s.innerHTML = html;
    this.stage.innerHTML = ''; this.stage.appendChild(s);
    return s;
  },

  begin() { this.score = 0; this.t0 = performance.now(); this.go('transition', { index: 0 }); },

  makeCtx(screen, replay) {
    const ctx = {
      root: $('#play', screen), replay: replay, dead: false, hintFn: null, _t: [],
      get locked() { return Game.locked; },
      after(ms, fn) {
        const id = setTimeout(() => { if (!ctx.dead) fn(); }, ms);
        ctx._t.push(id); return id;
      },
      clear() { ctx.dead = true; ctx._t.forEach(clearTimeout); ctx._t = []; },
      setRound(i, n) {
        const el = $('#pips', screen); if (!el) return;
        let h = ''; for (let k = 0; k < n; k++) h += '<i class="pip' + (k < i ? ' full' : k === i ? ' cur' : '') + '"></i>';
        el.innerHTML = h;
      },
      award(b, e, p) { return Game.award(b, e, p); },
      wrong(m) { return Game.wrong(m); },
      flash(t, k, ms) { Game.flash(t, k, ms); },
      ok() { Sfx.ok(); Haptic.ok(); Game.flash(pick(MSG.ok), 'ok'); },
      layerDone() { Game.layerComplete(); },
      setHint(fn) { ctx.hintFn = fn; }
    };
    return ctx;
  },

  destroyLayer() {
    Tutorial.cancel();
    if (this.layer && this.ctx) {
      try { this.layer.destroy(); } catch (e) {}
      this.ctx.clear();
    }
    this.ctx = null;
  },

  award(base, elapsed, par) {
    let bonus = 0;
    if (par > 0) bonus = Math.round(base * CONFIG.score.speedFactor * clamp(1 - elapsed / par, 0, 1));
    const total = base + bonus;
    this.score += total; Hud.setScore(true); Hud.float('+' + total, 'var(--g)');
    return total;
  },

  // Hata: bir can gider. Son can da giderse girdi kilitlenir ve KAYBETTİN ekranına geçilir.
  // Kalan canı döndürür (0 dönerse çağıran katman kendi akışını sürdürmemeli).
  wrong(msg) {
    if (this.locked) return this.lives;
    Sfx.err(); Haptic.err();
    this.flash(msg || pick(MSG.bad), 'bad');
    this.lives = Math.max(0, this.lives - 1); Hud.setLives(true);
    if (this.lives === 0) {
      this.locked = true;
      this.later(() => this.flash('SİSTEM ÇÖKTÜ', 'warn', 800), 700);
      this.later(() => this.go('gameover'), CONFIG.gameOverMs);
    }
    return this.lives;
  },

  useHint() {
    if (this.locked || !this.ctx) return;
    const fn = this.ctx.hintFn;
    if (this.hints <= 0 || !fn) { Sfx.err(); return; }
    if (fn() === false) return;                 // kullanılamadı: hak harcanmaz
    this.hints--; this.updateHint();
    this.score = Math.max(0, this.score - CONFIG.hintPenalty);
    Hud.setScore(false); Hud.float('−' + CONFIG.hintPenalty, 'var(--r)');
    Sfx.tone(880, 0.08, 'sine', 0.07);
  },

  updateHint() {
    const n = $('#hintN'), b = $('#hint');
    if (n) n.textContent = this.hints;
    if (b) b.dataset.n = this.hints;
  },

  flash(text, kind, ms) {
    const f = this.flashEl, col = { ok: 'var(--g)', bad: 'var(--r)', warn: 'var(--a)', info: 'var(--c)' };
    f.firstChild.textContent = text;
    f.style.setProperty('--fc', col[kind || 'ok']);
    f.classList.remove('show'); void f.offsetWidth;
    f.style.animationDuration = (ms || CONFIG.flashMs) + 'ms';
    f.classList.add('show');
  },

  layerComplete() {
    if (this.locked) return;
    this.locked = true;
    const next = this.layerIndex + 1;
    if (next >= Layers.length) this.go('final'); else this.go('transition', { index: next });
  },

  jump(i) {                                     // debug: istenen katmana atla
    if (!this.nick) this.nick = 'DEBUG';
    this.score = 0; this.t0 = performance.now();
    this.go('layer', { index: i });
  },

  onResize() {
    if (this.layer && this.state === 'layer' && this.layer.onResize) this.layer.onResize();
    if (this.state === 'final') Rain.fit();
  }
};

/* ============ DEBUG MENÜSÜ (?debug=1) ============ */
function setupDebug() {
  if (!CONFIG.allowDebug || !/[?&]debug=1(&|$)/.test(location.search)) return;
  const app = $('#app');
  const btn = document.createElement('button'); btn.id = 'dbgBtn'; btn.textContent = 'DBG';
  const pan = document.createElement('div'); pan.id = 'dbg'; pan.hidden = true;
  pan.innerHTML =
    '<div class="dbg-t">DEBUG</div>' +
    '<div class="dbg-g">' + Layers.map((l, i) => '<button class="btn" data-l="' + i + '">L' + (i + 1) + '</button>').join('') + '</div>' +
    '<div class="dbg-g">' +
      '<button class="btn" data-a="intro">INTRO</button><button class="btn" data-a="nick">NICK</button><button class="btn" data-a="final">FINAL</button>' +
      '<button class="btn" data-a="lose">KAYBETTİN</button><button class="btn" data-a="life">CAN −1</button><button class="btn" data-a="skip">KATMANI GEÇ</button>' +
      '<button class="btn" data-a="close">KAPAT</button>' +
    '</div>';
  app.appendChild(btn); app.appendChild(pan);
  tap(btn, () => { pan.hidden = !pan.hidden; });
  pan.querySelectorAll('button').forEach(b => tap(b, () => {
    const a = b.dataset.a;
    if (b.dataset.l != null) { pan.hidden = true; Game.jump(parseInt(b.dataset.l, 10)); return; }
    if (a === 'close') { pan.hidden = true; return; }
    if (a === 'intro') { pan.hidden = true; Game.go('intro'); }
    else if (a === 'nick') { pan.hidden = true; Game.go('nick'); }
    else if (a === 'final') {
      pan.hidden = true;
      if (!Game.nick) Game.nick = 'DEBUG';
      if (!Game.score) Game.score = 2345;
      Game.t0 = performance.now() - 754000;
      Game.go('final');
    }
    else if (a === 'lose') {
      pan.hidden = true;
      if (!Game.nick) Game.nick = 'DEBUG';
      if (!Game.score) Game.score = 1234;
      Game.t0 = performance.now() - 95000;
      Game.go('gameover');
    }
    else if (a === 'life') { if (Game.state === 'layer') Game.wrong('DEBUG'); }
    else if (a === 'skip') { pan.hidden = true; if (Game.state === 'layer') Game.layerComplete(); }
  }));
}

/* ============ BOOT ============ */
function fit() { document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px'); }

function boot() {
  const c = CONFIG.colors, rs = document.documentElement.style;
  rs.setProperty('--bg', c.bg); rs.setProperty('--g', c.green); rs.setProperty('--r', c.red); rs.setProperty('--a', c.amber); rs.setProperty('--c', c.cyan);
  fit();
  window.addEventListener('resize', () => { fit(); Game.onResize(); });
  window.addEventListener('orientationchange', () => setTimeout(() => { fit(); Game.onResize(); }, 200));

  // Zoom, kaydırma, seçme, bağlam menüsü engelleri
  ['gesturestart', 'gesturechange', 'gestureend', 'contextmenu', 'selectstart', 'dragstart', 'dblclick'].forEach(t =>
    document.addEventListener(t, e => e.preventDefault(), { passive: false }));
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

  // AudioContext ilk dokunuşta başlar (iOS için pointerup/touchend de dinlenir)
  ['pointerdown', 'pointerup', 'touchend'].forEach(t => document.addEventListener(t, () => Sfx.init(), { passive: true, capture: true }));

  Game.init(); Hud.init(); setupDebug();
  Game.nick = Store.get('hk_nick') || '';
  Game.go('intro');
}
boot();
</script>
